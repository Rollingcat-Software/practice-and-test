# FIVUCSAS Spoof Detector Configuration
# Session-based multi-method face spoof detection

camera:
  index: 0
  width: 1280
  height: 720

detection:
  backend: mediapipe        # mediapipe or retinaface
  min_confidence: 0.5

tracking:
  iou_threshold: 0.3
  max_lost_frames: 15

session:
  min_duration_sec: 5       # Minimum session for verdict (amispoof.com)
  max_duration_sec: 10800   # 3 hours max (proctoring)
  warmup_frames: 30         # ~1s baseline accumulation

analyzers:
  minifasnet:
    enabled: true
  texture:
    enabled: true
    laplacian_threshold: 100.0
    fft_downsample: [192, 108]
  moire:
    enabled: true
    response_std_threshold: 45.0
  screen_replay:
    enabled: true
  temporal:
    enabled: true
    buffer_size: 30
    min_motion_std: 0.0003
  device_boundary:
    enabled: true
    padding_ratio: 0.55
    spoof_threshold: 0.50
  blink:
    enabled: true            # EAR-based blink detection (MediaPipe FaceLandmarker)
  rppg:
    enabled: true            # Remote PPG pulse detection (3-5s warmup)
  ar_filter:
    enabled: true            # Heuristic mode (ONNX model optional)
    model_path: null         # Set to models/ar_filter_detector.onnx when trained
  makeup:
    enabled: false           # Experimental

# Calibrated weights based on ground-truth testing (2026-05-02):
#   MiniFASNet: +94.7 discrimination gap (PROVEN)
#   Device Boundary: +19.2 gap (GOOD for screen attacks)
#   Screen Replay: +9.6 gap (WEAK)
#   Temporal: neutral (needs multi-frame warmup)
#   Texture: -6.3 gap (ANTI-CORRELATED — suppressed)
#   Moire: -5.0 gap (ANTI-CORRELATED — suppressed)
# Calibrated 2026-05-02 from ground-truth data:
#   MiniFASNet: scores 0-12 on ALL spoofs, 93+ on real — ONLY reliable analyzer
#   rPPG: ANTI-CORRELATED (detects screen flicker as pulse, SNR 5-7 on spoofs vs 3.9 on real)
#   Blink: false blinks on spoofs (screen flicker) + 0 real blinks (threshold too strict)
fusion:
  weights:
    minifasnet: 5.0
    device_boundary: 2.5
    blink: 0.5
    rppg: 0.0
    screen_replay: 0.5
    ar_filter: 0.3
    temporal: 0.3
    texture: 0.1
    moire: 0.1

overlay:
  show_detail_panel: true
  show_profiler: false
  bbox_thickness: 2

logging:
  enabled: true
  output_dir: logs
  format: jsonl
  log_every_n_frames: 30    # Log every N frames (1 = every frame)
